spring.application.name=be-interview-prep

spring.datasource.url=jdbc:h2:mem:beprep;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# JWT signing key: required, at least 32 bytes, never committed. Set the JWT_SECRET environment variable.
app.jwt.secret=${JWT_SECRET:}
app.jwt.ttl=15m
app.jwt.issuer=be-interview-prep

# Optional first ADMIN account, created at startup when both are set.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Product listing: requests for more than 100 items per page are capped at 100.
spring.data.web.pageable.max-page-size=100
