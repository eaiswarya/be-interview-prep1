# Tests get a fresh random signing key on every run, so no secret is stored in the repository.
app.jwt.secret=${random.value}${random.value}

# Lets tests count the SQL statements Hibernate runs (used to prove product lookups hit the cache).
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=warn
